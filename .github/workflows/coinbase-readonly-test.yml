name: Coinbase Read-Only Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coinbase-read-only-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Coinbase SDK
        run: python -m pip install --upgrade pip coinbase-advanced-py

      - name: Test read-only account access
        env:
          COINBASE_API_KEY: ${{ secrets.COINBASE_API_KEY }}
          COINBASE_API_SECRET: ${{ secrets.COINBASE_API_SECRET }}
        run: python scripts/coinbase_readonly_test.py
