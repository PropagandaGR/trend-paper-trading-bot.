name: Paper Trading Heartbeat Watchdog

on:
  schedule:
    # Offset from common cron boundaries; this is still best-effort scheduling.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: paper-trading-heartbeat-watchdog
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check paper status and state freshness
        id: check
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          now = datetime.now(timezone.utc)
          max_age_seconds = 20 * 60
          issues = []
          for path, field in (
              ("reports/paper_status.json", "updated_at"),
              ("state/paper_state.json", "last_checked_at"),
          ):
              try:
                  data = json.load(open(path, encoding="utf-8"))
                  raw = data.get(field)
                  stamp = datetime.fromisoformat(str(raw).replace("Z", "+00:00"))
                  if stamp.tzinfo is None:
                      stamp = stamp.replace(tzinfo=timezone.utc)
                  age = (now - stamp.astimezone(timezone.utc)).total_seconds()
                  if age < -60 or age > max_age_seconds:
                      issues.append(f"{path}.{field} age is {age:.0f}s (limit {max_age_seconds}s; value={raw})")
              except Exception as exc:
                  issues.append(f"{path} could not be validated: {type(exc).__name__}: {exc}")

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"stale={'true' if issues else 'false'}\n")
          with open(os.environ["RUNNER_TEMP"] + "/paper-heartbeat-issue.txt", "w", encoding="utf-8") as handle:
              handle.write(
                  "The paper-trading heartbeat is stale or invalid.\n\n"
                  + "\n".join(f"- {item}" for item in issues)
                  + f"\n\nWatchdog run: https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}\n"
                  + "\nNo real orders are enabled. Inspect workflow history, Coinbase public data, and the persisted paper state before changing or resetting anything.\n"
              )
          if not issues:
              print("Paper status and state timestamps are fresh.")
          else:
              print("Heartbeat is stale:")
              print("\n".join(issues))
          PY
      - name: Open one operations issue if heartbeat is stale
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing=$(gh issue list --state open --search "Paper trader heartbeat stale in:title" --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh issue create \
              --title "Paper trader heartbeat stale" \
              --body-file "$RUNNER_TEMP/paper-heartbeat-issue.txt"
          else
            echo "An open paper-trader heartbeat issue already exists; not creating duplicates."
          fi
