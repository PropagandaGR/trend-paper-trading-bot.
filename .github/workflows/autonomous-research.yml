name: Autonomous Strategy Research

on:
  push:
    branches: [main]
    paths:
      - "research_engine.py"
      - "universe.py"
      - "tests/test_top100_universe.py"
      - "portfolio_accounting.py"
      - "requirements.txt"
      - ".github/workflows/autonomous-research.yml"
      - "tests/test_research*.py"
  schedule:
    # Run away from the top of the hour to reduce schedule congestion.
    - cron: "23 * * * *"
    - cron: "37 4 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days to research (30–365)"
        required: false
        default: "90"

permissions:
  contents: write

concurrency:
  group: autonomous-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Choose research window
        id: window
        shell: bash
        run: |
          DAYS="${{ github.event.inputs.days }}"
          if [ -z "$DAYS" ]; then DAYS=90; fi
          if [ "$DAYS" -lt 30 ] || [ "$DAYS" -gt 365 ]; then DAYS=90; fi
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
      - name: Mark research start time
        id: research_start
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Search and validate strategies
        run: python research_engine.py --days "${{ steps.window.outputs.days }}" --require-fresh-report
      - name: Independently verify fresh research artifacts
        env:
          RESEARCH_STARTED_AT: ${{ steps.research_start.outputs.started_at }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          report_path = Path("reports/research_latest.json")
          champion_path = Path("state/champion.json")
          if not report_path.is_file():
              raise SystemExit("FAIL: research report missing")
          report = json.loads(report_path.read_text())
          if report.get("run_status") != "completed" or report.get("evaluations", 0) <= 0:
              raise SystemExit("FAIL: research did not complete substantive evaluations")
          started = datetime.fromisoformat(report["started_at"].replace("Z", "+00:00"))
          completed = datetime.fromisoformat(report["completed_at"].replace("Z", "+00:00"))
          workflow_started = datetime.fromisoformat(__import__("os").environ["RESEARCH_STARTED_AT"].replace("Z", "+00:00"))
          now = datetime.now(timezone.utc)
          if started.tzinfo is None or completed.tzinfo is None or completed < started:
              raise SystemExit("FAIL: invalid research timestamps")
          if started < workflow_started or report_path.stat().st_mtime < workflow_started.timestamp() - 2:
              raise SystemExit("FAIL: report predates this workflow's research invocation")
          if (completed > now or (now - completed).total_seconds() > 900):
              raise SystemExit("FAIL: research report completion timestamp is stale or in the future")
          validation = report.get("validation_result")
          if not isinstance(validation, dict) or validation.get("status") != "validated":
              raise SystemExit("FAIL: research did not produce a validated champion")
          if validation.get("evaluations") != report["evaluations"]:
              raise SystemExit("FAIL: validation/evaluation counts disagree")
          active = json.loads(champion_path.read_text()) if champion_path.exists() else None
          if validation.get("validated_candidates", 0) < 1 or report.get("validated_count", 0) < 1:
              raise SystemExit("FAIL: validation produced no passing candidate")
          if not isinstance(active, dict):
              raise SystemExit("FAIL: validated result has no active champion")
          if not isinstance(report.get("champion"), dict):
              raise SystemExit("FAIL: fresh report has no champion object")
          metadata = active.get("validation_metadata", {})
          if not isinstance(active.get("champion_version"), str) or not active["champion_version"].startswith("champion-") or metadata.get("status") != "validated":
              raise SystemExit("FAIL: champion version/validated metadata missing")
          if active.get("champion_version") != report["champion"].get("champion_version"):
              raise SystemExit("FAIL: active champion does not match fresh report champion")
          if metadata.get("test_used_for_selection") is not False:
              raise SystemExit("FAIL: final-test isolation not recorded")
          for field in ("validation_metrics", "validation_stress_metrics", "test_metrics", "test_stress_metrics"):
              if not isinstance(metadata.get(field), dict):
                  raise SystemExit(f"FAIL: champion metadata missing {field}")
          cost = metadata.get("cost_convention")
          if not isinstance(cost, dict) or cost.get("fee_basis") != "executed notional":
              raise SystemExit("FAIL: champion cost convention missing or invalid")
          created_at = metadata.get("created_at")
          if not isinstance(created_at, str):
              raise SystemExit("FAIL: champion validation timestamp missing")
          validated_at = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
          if validated_at.tzinfo is None or validated_at < started or validated_at > completed:
              raise SystemExit("FAIL: champion validation timestamp is invalid or outside this run")
          version_file = Path("state/champions") / (active["champion_version"] + ".json")
          if not version_file.is_file():
              raise SystemExit("FAIL: immutable champion snapshot missing")
          snapshot = json.loads(version_file.read_text())
          if snapshot.get("champion_version") != active["champion_version"] or snapshot.get("validation_metadata") != metadata:
              raise SystemExit("FAIL: champion snapshot version/metadata mismatch")
          print(json.dumps({
              "report": str(report_path),
              "validation_status": validation["status"],
              "evaluations": report["evaluations"],
              "validated_candidates": validation.get("validated_candidates"),
              "champion_version": validation.get("champion_version"),
              "snapshot_verified": True,
          }, indent=2))
          PY
      - name: Commit research evidence and champion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports state
          git add -A -- reports state
          git diff --cached --quiet || git commit -m "Update autonomous strategy research"
          git pull --rebase origin main
          git push origin HEAD:main
