name: Autonomous Strategy Research

on:
  push:
    branches: [main]
    paths:
      - "research_engine.py"
      - "universe.py"
      - "tests/test_top100_universe.py"
      - "portfolio_accounting.py"
      - "requirements.txt"
      - ".github/workflows/autonomous-research.yml"
      - "tests/test_research*.py"
      - "paper_trader.py"
      - "tests/test_paper_trader*.py"
  schedule:
    # Run away from the top of the hour to reduce schedule congestion.
    - cron: "23 * * * *"
    - cron: "37 4 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days to research (30–365)"
        required: false
        default: "90"

permissions:
  contents: write

concurrency:
  group: autonomous-research
  # Never cancel a run after it has consumed an OOS reservation.
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Choose research window
        id: window
        shell: bash
        run: |
          DAYS="${{ github.event.inputs.days }}"
          if [ -z "$DAYS" ]; then DAYS=90; fi
          if [ "$DAYS" -lt 30 ] || [ "$DAYS" -gt 365 ]; then DAYS=90; fi
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
      - name: Mark research start time
        id: research_start
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Restore authoritative OOS ledger from dedicated branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state
          if git ls-remote --exit-code --heads origin refs/heads/oos-ledger >/dev/null; then
            git fetch origin refs/heads/oos-ledger:refs/remotes/origin/oos-ledger
            git show refs/remotes/origin/oos-ledger:state/oos_evaluation_ledger.json > state/oos_evaluation_ledger.json
          else
            # Bootstrap from the previous main-branch ledger if one exists. Keep
            # its last consumed boundary so old test periods can never re-enter
            # optimization. An unreadable/ambiguous legacy ledger fails closed.
            python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from datetime import datetime, timezone
          path = Path("state/oos_evaluation_ledger.json")
          if path.exists():
              data = json.loads(path.read_text())
              if data.get("policy_version") == "chronological-oos-v2":
                  pass
              elif data.get("policy_version") == "chronological-oos-v1":
                  end = data.get("last_test_end")
                  if not end:
                      raise SystemExit("FAIL: legacy OOS ledger has no last_test_end; manual audit required")
                  start = data.get("last_test_start") or end
                  identity = hashlib.sha256(f"legacy|{start}|{end}".encode()).hexdigest()[:20]
                  status = data.get("last_result")
                  if status not in {"passed", "failed"}:
                      status = "reserved"
                  data = {
                      "policy_version": "chronological-oos-v2",
                      "windows": [{
                          "id": identity, "start": start, "end": end,
                          "bars": int(data.get("last_window_bars", 1)),
                          "status": status, "reserved_at": data.get("reserved_at", "legacy-migration"),
                          "legacy_migrated": True,
                      }],
                      "last_test_start": start, "last_test_end": end, "last_result": status,
                  }
                  path.write_text(json.dumps(data, indent=2, sort_keys=True))
              else:
                  raise SystemExit("FAIL: unknown legacy OOS ledger format; refusing research")
          else:
              path.write_text(json.dumps({
                  "policy_version": "chronological-oos-v2", "windows": [],
                  "last_test_start": None, "last_test_end": None, "last_result": None,
              }, indent=2, sort_keys=True))
          PY
      - name: Search and validate strategies
        env:
          OOS_LEDGER_BRANCH: oos-ledger
        run: python research_engine.py --days "${{ steps.window.outputs.days }}" --require-fresh-report
      - name: Independently verify fresh research artifacts
        env:
          RESEARCH_STARTED_AT: ${{ steps.research_start.outputs.started_at }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          report_path = Path("reports/research_latest.json")
          champion_path = Path("state/champion.json")
          if not report_path.is_file():
              raise SystemExit("FAIL: research report missing")
          report = json.loads(report_path.read_text())
          if report.get("run_status") != "completed" or report.get("evaluations", 0) <= 0:
              raise SystemExit("FAIL: research did not complete substantive evaluations")
          if report.get("minimum_candle_coverage_pct") != 99.0 or report.get("maximum_consecutive_missing_slots") != 3 or report.get("maximum_fx_missing_pct") != 1.0:
              raise SystemExit("FAIL: report does not declare the strict candle/FX data-quality gates")
          policy = report.get("out_of_sample_policy")
          if (not isinstance(policy, dict) or policy.get("version") != "chronological-oos-v2"
              or policy.get("one_evaluation_per_non_overlapping_window") is not True
              or policy.get("rejected_windows_are_consumed") is not True
              or policy.get("test_failure_feedback_to_optimizer") is not False
              or policy.get("test_history_excluded_from_training_validation") is not True
              or policy.get("new_windows_require_strictly_later_data") is not True
              or policy.get("reservation_persisted_before_test_evaluation") is not True):
              raise SystemExit("FAIL: report does not enforce the versioned one-way OOS policy")
          quality = report.get("data_quality")
          if not isinstance(quality, dict) or not quality:
              raise SystemExit("FAIL: missing per-symbol data-quality evidence")
          quality_passed_symbols = {
              symbol for symbol, metrics in quality.items()
              if isinstance(metrics, dict) and metrics.get("quality_gate_passed") is True
          }
          if not quality_passed_symbols:
              raise SystemExit("FAIL: no symbol passed the strict data-quality gates")
          if report.get("cost_assumptions") != {
              "fee_bps_per_side": 60.0,
              "slippage_bps_per_side": 10.0,
              "stress_fee_bps_per_side": 100.0,
              "stress_slippage_bps_per_side": 20.0,
          }:
              raise SystemExit("FAIL: research cost assumptions differ from the approved conservative baseline/stress values")
          strategy_summary = report.get("strategy_benchmark_summary")
          if not isinstance(strategy_summary, dict) or not {"trend", "breakout", "mean_reversion"}.issubset(strategy_summary):
              raise SystemExit("FAIL: report is missing benchmark comparisons for one or more strategies")
          started = datetime.fromisoformat(report["started_at"].replace("Z", "+00:00"))
          completed = datetime.fromisoformat(report["completed_at"].replace("Z", "+00:00"))
          workflow_started = datetime.fromisoformat(__import__("os").environ["RESEARCH_STARTED_AT"].replace("Z", "+00:00"))
          now = datetime.now(timezone.utc)
          if started.tzinfo is None or completed.tzinfo is None or completed < started:
              raise SystemExit("FAIL: invalid research timestamps")
          if started < workflow_started or report_path.stat().st_mtime < workflow_started.timestamp() - 2:
              raise SystemExit("FAIL: report predates this workflow's research invocation")
          if (completed > now or (now - completed).total_seconds() > 900):
              raise SystemExit("FAIL: research report completion timestamp is stale or in the future")
          validation = report.get("validation_result")
          if not isinstance(validation, dict) or validation.get("status") != "validated":
              raise SystemExit("FAIL: research did not produce a validated champion")
          if validation.get("evaluations") != report["evaluations"]:
              raise SystemExit("FAIL: validation/evaluation counts disagree")
          active = json.loads(champion_path.read_text()) if champion_path.exists() else None
          if validation.get("validated_candidates", 0) < 1 or report.get("validated_count", 0) < 1:
              raise SystemExit("FAIL: validation produced no passing candidate")
          if not isinstance(active, dict):
              raise SystemExit("FAIL: validated result has no active champion")
          if not isinstance(report.get("champion"), dict):
              raise SystemExit("FAIL: fresh report has no champion object")
          if report["champion"].get("symbol") not in quality_passed_symbols:
              raise SystemExit("FAIL: champion did not come from a symbol that passed data-quality gates")
          champion_quality = quality[report["champion"]["symbol"]]
          if (
              champion_quality.get("source_coverage_pct", 0) < 99.0
              or champion_quality.get("converted_coverage_pct", 0) < 99.0
              or champion_quality.get("fx_missing_pct_of_source", 100) > 1.0
              or champion_quality.get("invalid_ohlc_rows", 1) != 0
              or champion_quality.get("converted_invalid_ohlc_rows", 1) != 0
              or champion_quality.get("conflicting_duplicate_groups", 1) != 0
              or champion_quality.get("unique_timestamps") is not True
              or champion_quality.get("monotonic_timestamps") is not True
              or champion_quality.get("timezone_aware_timestamps") is not True
              or champion_quality.get("unaligned_timestamps", 1) != 0
              or champion_quality.get("converted_unaligned_timestamps", 1) != 0
              or champion_quality.get("irregular_timestamp_gaps", 1) != 0
              or champion_quality.get("max_consecutive_missing_slots", 999) > 3
              or champion_quality.get("converted_max_consecutive_missing_slots", 999) > 3
              or champion_quality.get("converted_unique_timestamps") is not True
              or champion_quality.get("converted_monotonic_timestamps") is not True
          ):
              raise SystemExit("FAIL: champion symbol's data-quality metrics contradict the quality-gate flag")
          metadata = active.get("validation_metadata", {})
          if not isinstance(active.get("champion_version"), str) or not active["champion_version"].startswith("champion-") or metadata.get("status") != "validated":
              raise SystemExit("FAIL: champion version/validated metadata missing")
          if active.get("champion_version") != report["champion"].get("champion_version"):
              raise SystemExit("FAIL: active champion does not match fresh report champion")
          if metadata.get("test_used_for_selection") is not False:
              raise SystemExit("FAIL: final-test isolation not recorded")
          if metadata.get("oos_evaluation_policy_version") != "chronological-oos-v2":
              raise SystemExit("FAIL: champion is missing the current versioned OOS policy")
          for field in ("train_metrics", "validation_metrics", "validation_stress_metrics", "test_metrics", "test_stress_metrics"):
              if not isinstance(metadata.get(field), dict):
                  raise SystemExit(f"FAIL: champion metadata missing {field}")
          train = metadata["train_metrics"]
          if train.get("total_return_pct", float("-inf")) <= 0:
              raise SystemExit("FAIL: champion failed training robustness gate: training return must be positive")
          if train.get("max_drawdown_pct", float("inf")) >= 35:
              raise SystemExit("FAIL: champion failed training robustness gate: training drawdown must be below 35%")
          def beats_benchmarks(metrics, benchmarks):
              if not isinstance(metrics, dict) or not isinstance(benchmarks, dict):
                  return False
              if not {"cash", "buy_and_hold"}.issubset(benchmarks):
                  return False
              try:
                  candidate = float(metrics["total_return_pct"])
                  returns = [float(benchmarks[name]["total_return_pct"]) for name in ("cash", "buy_and_hold")]
              except (KeyError, TypeError, ValueError):
                  return False
              import math
              return all(math.isfinite(value) for value in [candidate, *returns]) and all(candidate > value for value in returns)
          for metrics_key, benchmarks_key in (
              ("validation_metrics", "validation_benchmarks"),
              ("validation_stress_metrics", "validation_stress_benchmarks"),
          ):
              if not beats_benchmarks(metadata.get(metrics_key), metadata.get(benchmarks_key)):
                  raise SystemExit(f"FAIL: champion {metrics_key} does not beat cash and buy-and-hold")
          for metrics_key, benchmarks_key in (
              ("test_metrics", "test_benchmarks"),
              ("test_stress_metrics", "test_stress_benchmarks"),
          ):
              metrics = metadata.get(metrics_key)
              if not beats_benchmarks(metrics, metadata.get(benchmarks_key)):
                  raise SystemExit(f"FAIL: champion {metrics_key} does not beat cash and buy-and-hold")
              if metrics.get("max_drawdown_pct", float("inf")) >= 25 or metrics.get("trades", 0) < 2:
                  raise SystemExit(f"FAIL: champion {metrics_key} fails held-out drawdown/trade-count gate")
          test_gate = metadata.get("test_deployment_gate")
          if not isinstance(test_gate, dict) or test_gate.get("passed") is not True or test_gate.get("failures") != []:
              raise SystemExit("FAIL: champion has not passed the held-out deployment veto")
          cost = metadata.get("cost_convention")
          if not isinstance(cost, dict) or cost.get("fee_basis") != "executed notional":
              raise SystemExit("FAIL: champion cost convention missing or invalid")
          created_at = metadata.get("created_at")
          if not isinstance(created_at, str):
              raise SystemExit("FAIL: champion validation timestamp missing")
          validated_at = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
          if validated_at.tzinfo is None or validated_at < started or validated_at > completed:
              raise SystemExit("FAIL: champion validation timestamp is invalid or outside this run")
          version_file = Path("state/champions") / (active["champion_version"] + ".json")
          if not version_file.is_file():
              raise SystemExit("FAIL: immutable champion snapshot missing")
          snapshot = json.loads(version_file.read_text())
          if snapshot.get("champion_version") != active["champion_version"] or snapshot.get("validation_metadata") != metadata:
              raise SystemExit("FAIL: champion snapshot version/metadata mismatch")
          print(json.dumps({
              "report": str(report_path),
              "validation_status": validation["status"],
              "evaluations": report["evaluations"],
              "validated_candidates": validation.get("validated_candidates"),
              "champion_version": validation.get("champion_version"),
              "snapshot_verified": True,
          }, indent=2))
          PY
      - name: Upload research evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-research-evidence-${{ github.run_id }}
          path: |
            reports/research_latest.json
            state/champion.json
            state/champions/
            state/oos_evaluation_ledger.json
          if-no-files-found: warn
          retention-days: 30
